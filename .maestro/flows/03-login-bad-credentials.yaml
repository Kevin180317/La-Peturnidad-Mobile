appId: com.idarko.lapeturnidad
name: Login shows auth error on wrong password
---
- launchApp:
    clearState: true
- tapOn: "Saltar"
- tapOn: "ejemplo@correo.com"
- inputText: "no-such-user@example.com"
- tapOn: "••••••••"
- inputText: "wrong-password"
- hideKeyboard
- tapOn:
    id: "login-submit"
- assertVisible: "Error de autenticación"
