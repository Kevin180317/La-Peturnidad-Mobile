appId: com.idarko.lapeturnidad
name: Login rejects empty form
---
- launchApp:
    clearState: true
- tapOn: "Saltar"
# Wait for the login screen before tapping, then for the 3 s toast to render.
- extendedWaitUntil:
    visible: "Inicia sesión para continuar"
    timeout: 10000
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Campos requeridos"
    timeout: 5000
