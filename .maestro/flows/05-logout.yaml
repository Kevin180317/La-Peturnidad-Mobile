appId: com.idarko.lapeturnidad
name: Logout confirm modal returns to login
env:
  TEST_EMAIL: ${TEST_EMAIL}
  TEST_PASSWORD: ${TEST_PASSWORD}
---
- runFlow: 04-login-success-and-relogin.yaml
- tapOn: "Perfil"
- scrollUntilVisible:
    element: "Cerrar Sesión"
- tapOn: "Cerrar Sesión"
# Modal title + confirm button share the label "Cerrar sesión"; confirm is the second match.
- tapOn:
    text: "Cerrar sesión"
    index: 1
- extendedWaitUntil:
    visible: "Inicia sesión para continuar"
    timeout: 10000
