# Buscar > Usuarios with an empty query lists the people you follow (FollowingList); tapping one opens their profile.
# Precondition: TEST_* follows at least one user (the admin account, from the screenshot flow 12).
# Env: TEST_EMAIL TEST_PASSWORD.
appId: com.idarko.lapeturnidad
name: Followers - Buscar lists followed users
---
- runFlow:
    file: ../subflows/login-as.yaml
    env: { EMAIL: "${TEST_EMAIL}", PASSWORD: "${TEST_PASSWORD}" }
- openLink: lapeturnidad://buscar
- extendedWaitUntil:
    visible: "Buscar mascotas, grupos, usuarios..."
    timeout: 8000
- tapOn: "Usuarios"
- extendedWaitUntil:
    visible: "Personas que sigues"
    timeout: 8000
- tapOn: "Admin Lucky Tracker"
- extendedWaitUntil:
    visible: "Mensaje"
    timeout: 8000
