# Buscar > Usuarios shows the idle hint from FollowingList.
# Env: TEST_EMAIL TEST_PASSWORD.
appId: com.idarko.lapeturnidad
name: Followers - Buscar users hint
---
- runFlow:
    file: ../subflows/login-as.yaml
    env: { EMAIL: "${TEST_EMAIL}", PASSWORD: "${TEST_PASSWORD}" }
- openLink: lapeturnidad://buscar
- extendedWaitUntil:
    visible: "Buscar mascotas, grupos, usuarios..."
    timeout: 8000
- tapOn: "Usuarios"
- assertVisible: "Escribe un nombre para buscar usuarios"
