appId: com.idarko.lapeturnidad
name: Docs screenshots - Feed segments and Emergencia (no alert is created)
env:
  OUT: ${OUT}
---
- launchApp
- extendedWaitUntil:
    visible: "Inicio"
    timeout: 25000
- tapOn: "Feed"
- tapOn: "Emergencias"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: ${OUT}/dash-feed-emergencias
- tapOn: "Anuncios"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: ${OUT}/dash-feed-anuncios
- tapOn: "Social"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/dash-feed-social
- tapOn: "Emergencia"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/dash-emergencia
- tapOn: "Reportar mascota perdida"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/dash-emergencia-report
- tapOn: "Luna"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/dash-emergencia-confirm
- tapOn: "Cancelar"
- tapOn: "Mis alertas"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/dash-emergencia-mis-alertas
- tapOn: "Encontradas"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/dash-emergencia-encontradas
