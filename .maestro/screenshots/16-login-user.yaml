appId: com.idarko.lapeturnidad
name: Docs screenshots - log in as the normal account from onboarding
env:
  TEST_EMAIL: ${TEST_EMAIL}
  TEST_PASSWORD: ${TEST_PASSWORD}
---
- launchApp
- extendedWaitUntil:
    visible: "Saltar"
    timeout: 15000
- tapOn: "Saltar"
- extendedWaitUntil:
    visible: "Inicia sesión para continuar"
    timeout: 10000
- tapOn: "ejemplo@correo.com"
- inputText: ${TEST_EMAIL}
- tapOn: "••••••••"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Inicio"
    timeout: 25000
