appId: com.idarko.lapeturnidad
name: Docs screenshots - post form, a social post and a notice
env:
  OUT: ${OUT}
---
- launchApp
- extendedWaitUntil:
    visible: "Inicio"
    timeout: 25000
- tapOn: "Feed"
- tapOn: "Publicar"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/dash-post-form
- tapOn: "Cuéntale a tu comunidad..."
- inputText: "Milo y Luna ya son mejores amigos. Paseo de hoy en el parque #gatos #perros #paseo"
- hideKeyboard
- tapOn: "Galería"
- extendedWaitUntil:
    visible: "Photos"
    timeout: 8000
- tapOn:
    point: "50%,46%"
- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"
- waitForAnimationToEnd:
    timeout: 4000
- scrollUntilVisible:
    element: "Mi zona"
- tapOn: "Mi zona"
- hideKeyboard
- takeScreenshot: ${OUT}/dash-post-form-filled
- tapOn: "Publicar"
- waitForAnimationToEnd:
    timeout: 6000
- tapOn: "Publicar"
- tapOn: "Anuncio"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/dash-post-form-announcement
- tapOn: "Título de la publicación"
- inputText: "Jornada de vacunación gratuita"
- tapOn: "Cuéntale a tu comunidad..."
- inputText: "El sábado habrá vacunación antirrábica gratuita para perros y gatos en el parque de la colonia, de 10:00 a 14:00."
- hideKeyboard
- tapOn: "Publicar"
- waitForAnimationToEnd:
    timeout: 6000
